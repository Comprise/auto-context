name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Output of `auto-context version -v`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and its version
      placeholder: Claude Code 2.1.x, Codex CLI 0.x
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `auto-context status`
      render: text
    validations:
      required: true
  - type: input
    id: logerrors
    attributes:
      label: Number of errors in `.auto-context/log`
      description: Count the lines, for example `wc -l .auto-context/log`. Do not paste the file; it may contain paths.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
