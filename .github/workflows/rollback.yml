name: rollback

# Puts an earlier release back on the branch `release` without a force-push: a
# new commit on top of the branch holds the tree of dist/<to> with the version
# <current>+1 patch, so installed plugins update to it (they only move to a
# higher version). The binaries keep the version they were built with, which
# `auto-context version` shows. The next real release must be higher than the
# rollback version: release.yml refuses a tag whose dist tag a rollback made,
# in guard and again in publish right before it pushes (a rollback may run
# while the release waits for approval); see docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      to:
        description: The dist tag of the release to go back to (dist/vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# Shares the group of no release run, so it never cancels one; two rollbacks
# queue. A rollback and a release pushing at the same time are safe: both push
# on top of the head they read without force, so the later push is rejected as
# non-fast-forward and its run fails (re-run it).
concurrency: rollback

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit the old tree on top of release
        env:
          TO: ${{ inputs.to }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$TO" | grep -Eq '^dist/v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::'$TO' is not a stable dist tag dist/vX.Y.Z"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TO^{commit}" >/dev/null || {
            echo "::error::tag $TO does not exist"; exit 1; }
          head=refs/remotes/origin/release
          cur=$(git show "$head:.claude-plugin/plugin.json" | jq -r .version)
          echo "$cur" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::release is at '$cur', not X.Y.Z"; exit 1; }
          next="${cur%.*}.$(( ${cur##*.} + 1 ))"
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          git archive "$TO" | tar -x -C "$tree"
          for m in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "$next" '.version=$v' "$tree/$m" > "$tree/$m.tmp" && mv "$tree/$m.tmp" "$tree/$m"
          done
          sh .github/scripts/check-manifests.sh "$tree" "$next" release
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/rollback.index"
          git --git-dir="$PWD/.git" --work-tree="$tree" -C "$tree" add -A -f .
          treeid=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git commit-tree "$treeid" -p "$head" -m "rollback to ${TO#dist/} as v$next" \
            -m "tree: $TO ($(git rev-parse "$TO^{commit}")), run by ${GITHUB_ACTOR}")
          git push --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$commit:refs/heads/release" "$commit:refs/tags/dist/v$next"
          echo "::notice::release is now v$next with the tree of $TO"
