name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One run per tag: a run of another tag is neither cancelled nor queued behind.
concurrency: release-${{ github.ref }}

jobs:
  guard:
    # A tag reaches every user, so only a tag on a commit from main may publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is semver
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CHANGELOG has notes for the tag
        run: sh .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - name: Version not taken by a rollback
        # rollback.yml puts an old tree on release under a new version; a tag
        # of that version would publish new notes over the old code.
        run: |
          if sh .github/scripts/rollback-took.sh "$GITHUB_REF_NAME" origin/release; then
            echo "::error::a rollback took the version $GITHUB_REF_NAME. Tag a version above it."
            exit 1
          fi

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      # No module or build cache written by main or PR runs in a release.
      cache: false

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      - name: Build
        # The Makefile holds the build flags (one source for local and release builds).
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          make dist VERSION="$GITHUB_REF_NAME" PLATFORMS="$PLATFORM"
          go version -m libexec/*
          sha256sum libexec/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: libexec/*
          if-no-files-found: error

  reproduce:
    # The same commit and toolchain (pinned in go.mod) must give the same bytes
    # on another runner, so anyone can check a release binary against the source.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-linux-amd64
          path: ${{ runner.temp }}/released
      - name: Rebuild linux/amd64 and compare
        run: |
          make dist VERSION="$GITHUB_REF_NAME" PLATFORMS=linux/amd64
          a=$(sha256sum < libexec/auto-context-linux-amd64)
          b=$(sha256sum < "$RUNNER_TEMP/released/auto-context-linux-amd64")
          echo "rebuilt  $a"
          echo "released $b"
          [ "$a" = "$b" ] || { echo "::error::linux/amd64 build is not reproducible"; exit 1; }

  package:
    # The tree users install, its archive, checksums and the release notes.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: libexec
          merge-multiple: true
      - name: Tree, archive and checksums
        run: |
          tree="$RUNNER_TEMP/tree"
          out="$RUNNER_TEMP/out"
          mkdir -p "$tree" "$out"
          # .gitattributes keeps the shim LF in a clone with core.autocrlf.
          cp -r .claude-plugin .codex-plugin .agents hooks skills bin libexec README.md README.ru.md LICENSE .gitattributes "$tree/"
          # plugin.json on main has no version; the tag is the single source.
          for m in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "${GITHUB_REF_NAME#v}" '.version=$v' "$m" > "$tree/$m"
          done
          chmod +x "$tree"/libexec/* "$tree/bin/auto-context"
          # In the tree: paths relative to the plugin directory, no archive line,
          # so `sha256sum -c checksums.txt` works where the plugin is installed.
          (cd "$tree" && sha256sum libexec/auto-context-*) > "$RUNNER_TEMP/tree-checksums.txt"
          mv "$RUNNER_TEMP/tree-checksums.txt" "$tree/checksums.txt"
          sh .github/scripts/check-manifests.sh "$tree" "${GITHUB_REF_NAME#v}" release
          archive="auto-context-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$out/$archive" -C "$tree" .claude-plugin .codex-plugin .agents hooks skills bin libexec README.md README.ru.md LICENSE .gitattributes checksums.txt
          # The release asset: flat names, so `sha256sum -c` works in a
          # directory with the downloaded assets; it also covers the archive.
          (cd "$tree/libexec" && sha256sum auto-context-*) > "$out/checksums.txt"
          (cd "$out" && sha256sum "$archive") >> "$out/checksums.txt"
          cat "$out/checksums.txt"
          sh .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$out/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  validate:
    # The npm code of the claude CLI runs here, in a job with a read-only token
    # and no publishing step.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/out
      - name: Unpack the tree users install
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "$RUNNER_TEMP/out/auto-context-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP/tree"
          sh .github/scripts/check-manifests.sh "$RUNNER_TEMP/tree" "${GITHUB_REF_NAME#v}" release
      - name: Install the claude CLI
        run: sh .github/scripts/install-claude.sh
      - name: Validate strictly
        # --strict: warnings (most broken skill frontmatter, an unknown hook
        # event) fail the release; without it validate exits 0 on them.
        # TestSkillsFrontmatter covers the YAML the validator lets through.
        working-directory: ${{ runner.temp }}/tree
        run: claude plugin validate --strict .

  smoke:
    # Each binary runs once through the shim from the archive before users get it.
    needs: package
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the x86-64 macOS runner (macos-13 is retired).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/out
      - name: Version and SessionStart through the shim
        run: |
          # Forward slashes: bash and the Windows binary both read D:/a/_temp.
          tmp=${RUNNER_TEMP//\\//}
          tree="$tmp/tree"
          fx="$tmp/fixture"
          mkdir -p "$tree" "$fx/context"
          # A relative archive name: GNU tar reads "D:..." as a remote host.
          (cd "$tmp/out" && tar -xzf "auto-context-${GITHUB_REF_NAME}.tar.gz" -C "$tree")
          v=$(sh "$tree/bin/auto-context" version)
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::version printed '$v', want $GITHUB_REF_NAME"; exit 1; }
          printf -- '---\nsummary: smoke\n---\n# smoke\n' > "$fx/context/_root.md"
          git -C "$fx" init -q
          cd "$fx"
          echo '{}' | CLAUDE_PROJECT_DIR="$fx" sh "$tree/bin/auto-context" hook session-start > out.json
          cat out.json
          jq -e '.hookSpecificOutput.hookEventName == "SessionStart"' out.json

  publish:
    needs: [package, validate, smoke, reproduce]
    runs-on: ubuntu-latest
    # Required reviewers on the environment: nothing gets a write token unapproved.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/out
      - name: Unpack the tree
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "$RUNNER_TEMP/out/auto-context-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP/tree"
          sh .github/scripts/check-manifests.sh "$RUNNER_TEMP/tree" "${GITHUB_REF_NAME#v}" release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/tree/libexec/*
            ${{ runner.temp }}/tree/checksums.txt
            ${{ runner.temp }}/out/auto-context-*.tar.gz
            ${{ runner.temp }}/out/checksums.txt
      - name: Draft GitHub Release
        # A draft first: users never see a release whose branch push failed.
        # A re-run of a published tag leaves the release alone.
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          set -- "$out/auto-context-${GITHUB_REF_NAME}.tar.gz" "$out/checksums.txt" "$RUNNER_TEMP"/tree/libexec/*
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case $state in
            false)
              echo "::notice::release $GITHUB_REF_NAME is already published"
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            true)
              gh release upload "$GITHUB_REF_NAME" "$@" --clobber
              gh release edit "$GITHUB_REF_NAME" --notes-file "$out/notes.md" ;;
            *)
              pre=""
              case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
                --notes-file "$out/notes.md" $pre "$@" ;;
          esac
      - name: Update the release branch
        # Users install from the branch `release`; pre-releases (a hyphen in the
        # tag) go to `release-next` instead. A branch only moves to a higher
        # version (an older tag pushed later would roll every user back) and
        # only fast-forwards (no force-push): each commit holds only the tree
        # users install and has the previous branch head as its only parent,
        # so main's history never reaches installs; the message names the
        # tagged commit. A re-run finds the branch at this version already and
        # pushes nothing.
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$RUNNER_TEMP/tree"
          new="${GITHUB_REF_NAME#v}"
          case $new in *-*) branch=release-next ;; *) branch=release ;; esac
          head="refs/remotes/origin/$branch"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Fresh state: a rollback may have run since the checkout or the guard
          # (this job waits for the environment approval).
          git fetch -q "$remote" "+refs/heads/$branch:$head" 2>/dev/null || true
          # The same check as in guard.
          if sh .github/scripts/rollback-took.sh "$GITHUB_REF_NAME" "$head"; then
            echo "::error::a rollback took the version $GITHUB_REF_NAME. Tag a version above it."
            exit 1
          fi
          cur=""
          if git rev-parse -q --verify "$head" >/dev/null; then
            cur=$(git show "$head:.claude-plugin/plugin.json" | jq -r '.version // "0.0.0"')
          fi
          if [ -z "$cur" ] || sh .github/scripts/version-gt.sh "$new" "$cur"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            # A separate index holds exactly the unpacked tree.
            export GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
            git --git-dir="$PWD/.git" --work-tree="$tree" -C "$tree" add -A -f .
            treeid=$(git write-tree)
            unset GIT_INDEX_FILE
            set --
            if [ -n "$cur" ]; then set -- -p "$head"; fi
            commit=$(git commit-tree "$treeid" "$@" -m "release ${GITHUB_REF_NAME}" -m "source: ${GITHUB_SHA}")
            git push "$remote" "$commit:refs/heads/$branch"
            cur=$new
          else
            echo "::notice::$branch is at $cur; $new is not newer, the branch stays"
          fi
          # Latest only when the stable branch is at this version now.
          latest=false
          if [ "$branch" = release ] && [ "$cur" = "$new" ]; then latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Release branch clone size
        # Codex clones the whole branch (not shallow, measured 2026-10-24), and
        # every release adds about 24 MB of binaries to its history. Only a
        # warning: see "Release branch size" in docs/RELEASING.md.
        run: |
          branch=release
          case "${GITHUB_REF_NAME#v}" in *-*) branch=release-next ;; esac
          git clone -q --bare --single-branch --branch "$branch" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/size.git" || {
            echo "::notice::cannot clone $branch to measure it"; exit 0; }
          kb=$(du -sk "$RUNNER_TEMP/size.git" | cut -f1)
          echo "$branch clone: $((kb / 1024)) MiB"
          if [ "$kb" -gt 204800 ]; then
            echo "::warning::branch $branch clones at $((kb / 1024)) MiB (over 200 MiB); see Release branch size in docs/RELEASING.md"
          fi
      - name: Publish GitHub Release
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.branch.outputs.latest }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$LATEST"
