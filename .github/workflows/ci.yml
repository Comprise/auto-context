name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs
      # Docs only: nothing to build or test. Skills are Markdown too but are
      # validated by the plugin job, so they are not listed here.
      - 'context/**'
      - 'docs/**'
      - '**/CLAUDE.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress. Release
# runs (tags) are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: Shim syntax
        shell: bash
        run: sh -n bin/auto-context

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate Codex manifests
        run: jq -e . .codex-plugin/plugin.json hooks/codex.json
      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.304 plugin validate .
      - name: Validate the shipped tree strictly
        # The repo root warns about its dev CLAUDE.md and the version the release
        # stamps; the tree users get must pass with no warning at all.
        run: |
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          cp -r .claude-plugin .codex-plugin hooks skills bin README.md LICENSE "$tree/"
          jq '.version="0.0.0-ci"' .claude-plugin/plugin.json > "$tree/.claude-plugin/plugin.json"
          jq '.version="0.0.0-ci"' .codex-plugin/plugin.json > "$tree/.codex-plugin/plugin.json"
          cd "$tree" && npx --yes @anthropic-ai/claude-code@2.1.304 plugin validate --strict .
